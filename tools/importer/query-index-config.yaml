# Query-index configuration for the Škoda Storyboard EN stories index.
#
# NOTE: for this DA/markup project the indexer config is NOT read from the repo
# (helix-query.yaml is retired — see AGENTS.md). It is submitted to the admin
# config service at:
#   PUT https://admin.hlx.page/config/larsauffarth/sites/skoda-storyboard/content/query.yaml
# This file is kept only as the source-of-truth record of what was submitted.
#
# The `stories` block fetches /en/query-index.json and keeps entries whose
# `template` == "story", then sorts by `publisheddate` descending.
version: 1
indices:
  stories:
    include:
      - /en/stories/**
    target: /en/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')
      publisheddate:
        select: head > meta[name="publisheddate"]
        value: |
          attribute(el, 'content')
      category:
        select: head > meta[name="category"]
        value: |
          attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
