# Query-index configuration for the Škoda Storyboard EN index.
#
# NOTE: for this DA/markup project the indexer config is NOT read from the repo
# (helix-query.yaml is retired — see AGENTS.md). It is submitted to the admin
# config service at:
#   https://admin.hlx.page/config/larsauffarth/sites/skoda-storyboard/content/query.yaml
# GOTCHA: PUT = CREATE-ONLY (409 AEM_BACKEND_CONFIG_EXISTS if it already exists);
# to UPDATE an existing config use POST (204). Source-of-truth record below.
#
# One index at /en/query-index.json feeds every rail/listing. Blocks filter it
# client-side by `template` (story | press_release | skoda_model | image | video
# | press_kit | series) and, where relevant, `category`, `tags`, and `series`.
#
# The include scope widened from /en/stories/** to /en/** so the rail-feed corpus
# (models, series, press releases/kits, images, videos, tagged stories) is indexed.
version: 1
indices:
  stories:
    include:
      - /en/**
    target: /en/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      image:
        select: head > meta[property="og:image"]
        value: |
          attribute(el, 'content')
      publisheddate:
        select: head > meta[name="publisheddate"]
        value: |
          attribute(el, 'content')
      category:
        select: head > meta[name="category"]
        value: |
          attribute(el, 'content')
      template:
        select: head > meta[name="template"]
        value: |
          attribute(el, 'content')
      tags:
        # `tags` is a reserved EDS metadata key (not emitted as <meta>); the
        # importer writes the model/topic tags under `modeltags` instead.
        select: head > meta[name="modeltags"]
        value: |
          attribute(el, 'content')
      series:
        select: head > meta[name="series"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
